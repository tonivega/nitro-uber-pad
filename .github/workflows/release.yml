name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # Tag name for tag builds; otherwise the scripts fall back to `git describe`.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  linux-windows:
    name: Linux (amd64, arm64) + Windows (x64) in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Expose GitHub Actions cache to Buildx
        uses: crazy-max/ghaction-github-runtime@v3
      - name: Build in Docker
        env:
          DOCKER_CACHE: gha
        run: bash scripts/build-docker.sh --no-macos
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-windows
          path: output/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS (arm64, amd64, universal)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go.sum
      - name: Tidy modules
        run: go mod tidy
      - name: Build
        run: bash scripts/build.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-macos
          path: output/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Package and publish
    needs: [linux-windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: output
          merge-multiple: true
      - name: Package
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
